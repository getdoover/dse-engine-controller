[project]
name = "dse-simulator"
version = "0.1.0"
description = "Modbus TCP simulator for DSE E400 engine controllers (GenComm)"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.4.2",
    "pymodbus==3.9.2",
    "transitions>=0.9.2",
]

[project.scripts]
dse-sim = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py", "model.py"]

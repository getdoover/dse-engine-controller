[project]
name = "dse-engine-controller"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.15.2",
    "transitions>=0.9.2",
]

[project.scripts]
doover-app-run = "dse_engine_controller:main"
export-config = "dse_engine_controller.app_config:export"
export-ui = "dse_engine_controller.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "requests>=2.32.3",
]
